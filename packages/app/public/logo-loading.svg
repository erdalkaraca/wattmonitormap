<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes windFlow {
        0% {
          stroke-dashoffset: 10;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }
      
      @keyframes rotateTurbine {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      
      #turbine-blades {
        transform-origin: 64px 62px;
        animation: rotateTurbine 3s linear infinite;
      }
      
      #wind-effect path {
        stroke-dasharray: 4, 3;
        animation: windFlow 2s linear infinite;
      }
      
      #wind-effect path:nth-child(2) {
        animation-delay: 0.5s;
      }
      
      #sun-rays line {
        stroke-dasharray: 4, 3;
        animation: windFlow 2s linear infinite;
      }
      
      #sun-rays line:nth-child(2) {
        animation-delay: 0.2s;
      }
      
      #sun-rays line:nth-child(3) {
        animation-delay: 0.4s;
      }
      
      #sun-rays line:nth-child(4) {
        animation-delay: 0.6s;
      }
      
      #sun-rays line:nth-child(5) {
        animation-delay: 0.8s;
      }
      
      #sun-rays line:nth-child(6) {
        animation-delay: 1s;
      }
      
      #sun-rays line:nth-child(7) {
        animation-delay: 1.2s;
      }
      
      #sun-rays line:nth-child(8) {
        animation-delay: 1.4s;
      }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="62" fill="none" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Sun (top right) -->
  <g id="sun">
    <!-- Sun rays -->
    <g id="sun-rays">
      <line x1="90" y1="20" x2="90" y2="10" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <line x1="90" y1="56" x2="90" y2="66" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <line x1="108" y1="38" x2="118" y2="38" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <line x1="72" y1="38" x2="62" y2="38" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <line x1="102" y1="24" x2="109" y2="17" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <line x1="78" y1="50" x2="71" y2="57" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <line x1="102" y1="52" x2="109" y2="59" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <line x1="78" y1="26" x2="71" y2="19" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Sun circle (static) -->
    <circle cx="90" cy="38" r="14" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <!-- Sun core -->
    <circle cx="90" cy="38" r="8" fill="#fbbf24"/>
  </g>
  
  <!-- Wind Turbine -->
  <g id="turbine">
    <!-- Tower -->
    <rect x="59" y="70" width="10" height="40" fill="#4b5563" rx="2"/>
    
    <!-- Base platform -->
    <ellipse cx="64" cy="110" rx="16" ry="6" fill="#6b7280"/>
    <rect x="48" y="110" width="32" height="3" fill="#4b5563" rx="1.5"/>
    
    <!-- Rotating blades group -->
    <g id="turbine-blades">
      <!-- Turbine blade 1 (0 degrees - pointing up) -->
      <g>
        <ellipse cx="64" cy="40" rx="3.5" ry="18" fill="#3b82f6" opacity="0.9"/>
        <circle cx="64" cy="58" r="2" fill="#3b82f6"/>
      </g>
      
      <!-- Turbine blade 2 (120 degrees) -->
      <g transform="rotate(120 64 62)">
        <ellipse cx="64" cy="40" rx="3.5" ry="18" fill="#3b82f6" opacity="0.8"/>
        <circle cx="64" cy="58" r="2" fill="#3b82f6"/>
      </g>
      
      <!-- Turbine blade 3 (240 degrees) -->
      <g transform="rotate(240 64 62)">
        <ellipse cx="64" cy="40" rx="3.5" ry="18" fill="#3b82f6" opacity="0.7"/>
        <circle cx="64" cy="58" r="2" fill="#3b82f6"/>
      </g>
    </g>
    
    <!-- Turbine hub (rendered last to appear on top) -->
    <circle cx="64" cy="62" r="6" fill="#ef4444"/>
  </g>
  
  <!-- Decorative elements -->
  <g id="energy-indicator" opacity="0.6">
    <!-- Small lightning bolt near turbine -->
    <path d="M 45 75 L 48 80 L 44 80 L 50 88 L 45 85 L 49 85 Z" fill="#fbbf24"/>
  </g>
  
  <!-- Wind effect curves (animated) -->
  <g id="wind-effect" opacity="0.6" stroke="#60a5fa" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Left wind curves flowing right -->
    <path d="M 30 50 Q 40 45 50 50"/>
    <path d="M 25 65 Q 38 62 50 68"/>
  </g>
</svg>

